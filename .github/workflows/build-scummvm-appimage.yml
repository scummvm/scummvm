name: Build ScummVM (AppImage + Arch pkg, all engines, release, shaders)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}
  push:
    branches: [master]

env:
  UPSTREAM_REPO: scummvm/scummvm
  UPSTREAM_BRANCH: master
  RELEASE_TAG: continuous

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # 1) Controlla se c'è un nuovo commit upstream rispetto all'ultima release
  # ---------------------------------------------------------------------
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      short_sha: ${{ steps.check.outputs.short_sha }}
    steps:
      - name: Get latest upstream commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/${UPSTREAM_REPO}.git refs/heads/${UPSTREAM_BRANCH} | cut -f1)
          LAST_SHA=$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null | grep -oE '[0-9a-f]{40}' | head -n1 || true)
          if [ "$UPSTREAM_SHA" != "$LAST_SHA" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${UPSTREAM_SHA:0:7}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # 2) AppImage: due varianti, generic (SSE4.2) e avx2 (AVX2+FMA)
  # ---------------------------------------------------------------------
  build-appimage:
    needs: check-updates
    if: needs.check-updates.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: generic
            cflags: "-O3 -msse4.2 -mpopcnt"
            configure_extra: "--enable-ext-sse2 --disable-debug"
          - variant: avx2
            cflags: "-O3 -msse4.2 -mpopcnt -mavx -mavx2 -mfma -mbmi -mbmi2 -mmovbe"
            configure_extra: "--enable-ext-sse2 --enable-ext-avx2 --disable-debug"
    steps:
      - name: Prepara repository APT Bookworm
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          elif [ -f /etc/apt/sources.list ]; then
            sed -Ei 's/^(deb .* main)$/\1 contrib non-free non-free-firmware/' /etc/apt/sources.list
          fi
          apt-get update

      - name: Installa dipendenze di build
        run: |
          apt-get install -y --no-install-recommends \
            build-essential git ca-certificates pkg-config nasm wget curl file \
            libsdl2-dev libsdl2-net-dev \
            libfreetype6-dev \
            libpng-dev libjpeg62-turbo-dev libgif-dev \
            libtheora-dev libfaad-dev libmad0-dev \
            libvorbis-dev libogg-dev libflac-dev \
            libmpeg2-4-dev \
            libfluidsynth-dev \
            libspeex-dev libspeexdsp-dev \
            libvpx-dev \
            libcurl4-openssl-dev \
            libglew-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libgtk-3-bin libglib2.0-bin \
            librsvg2-common adwaita-icon-theme shared-mime-info \
            zlib1g-dev libbz2-dev \
            libutf8proc-dev \
            liba52-0.7.4-dev \
            desktop-file-utils appstream

      - name: Checkout ScummVM upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check-updates.outputs.upstream_sha }}
          path: scummvm

      - name: Configure (release, tutti i motori, shader, CPU ${{ matrix.variant }})
        working-directory: scummvm
        env:
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cflags }}
        run: |
          ./configure \
            --enable-release \
            --enable-optimizations \
            --enable-all-engines \
            --disable-debug \
            ${{ matrix.configure_extra }} \
            --prefix=/usr

      - name: Build
        working-directory: scummvm
        run: make -j"$(nproc)"

      - name: Install in AppDir
        working-directory: scummvm
        run: make install DESTDIR="$GITHUB_WORKSPACE/AppDir"

      - name: Scarica linuxdeploy
        run: |
          curl -fL -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fL -o linuxdeploy-plugin-appimage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          curl -fL -o linuxdeploy-plugin-gtk https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage linuxdeploy-plugin-gtk

      - name: Individua .desktop e icona
        working-directory: scummvm
        run: |
          if [ -f "dists/scummvm.desktop" ]; then
            DESKTOP_FILE="dists/scummvm.desktop"
          else
            DESKTOP_FILE=$(find dists -maxdepth 1 -iname "*.desktop" | head -n1)
          fi
          ICON_FILE=$(find icons dists gui -iname "scummvm.svg" -o -iname "scummvm.png" 2>/dev/null | head -n1)
          echo "DESKTOP_FILE=$(realpath "$DESKTOP_FILE")" >> "$GITHUB_ENV"
          echo "ICON_FILE=$(realpath "$ICON_FILE")" >> "$GITHUB_ENV"

      - name: Costruisci AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          DEPLOY_GTK_VERSION: "3"
        run: |
          export PATH="$PWD:$PATH"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e AppDir/usr/bin/scummvm \
            -d "$DESKTOP_FILE" \
            -i "$ICON_FILE" \
            --plugin gtk \
            --output appimage
          mv ScummVM*.AppImage "ScummVM-${{ matrix.variant }}.AppImage"

      - name: Verifica e aggiorna compatibilità runtime
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "ScummVM-${{ matrix.variant }}.AppImage" -print -quit)
          test -n "$APPIMAGE"

          . /etc/os-release
          BUILD_BASELINE="${PRETTY_NAME:-Debian Bookworm}"
          BUILDER_GLIBC=$(getconf GNU_LIBC_VERSION | awk '{print $2}')

          EXTRACT_DIR="$RUNNER_TEMP/scummvm-appimage-${{ matrix.variant }}"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          (
            cd "$EXTRACT_DIR"
            "$APPIMAGE" --appimage-extract >/dev/null
          )

          MAX_GLIBC=$(
            {
              readelf --version-info "$APPIMAGE" 2>/dev/null || true
              find "$EXTRACT_DIR/squashfs-root" -type f -print0 |
              while IFS= read -r -d '' candidate; do
                if file -b "$candidate" 2>/dev/null | grep -q '^ELF'; then
                  readelf --version-info "$candidate" 2>/dev/null || true
                fi
              done
            } |
            grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' |
            sed 's/^GLIBC_//' |
            sort -V |
            tail -n1 || true
          )

          if [ -z "$MAX_GLIBC" ]; then
            echo "::error::Impossibile determinare la GLIBC minima richiesta dall'AppImage"
            exit 1
          fi

          if ! dpkg --compare-versions "$MAX_GLIBC" le "$BUILDER_GLIBC"; then
            echo "::error::L'AppImage richiede GLIBC $MAX_GLIBC, più nuova della baseline del builder $BUILDER_GLIBC"
            exit 1
          fi

          REPORT="$GITHUB_WORKSPACE/ScummVM-${{ matrix.variant }}-compat.txt"
          {
            echo "ScummVM AppImage compatibility report"
            echo "Generated automatically by GitHub Actions"
            echo
            echo "Variant: ${{ matrix.variant }}"
            echo "Source commit: ${{ needs.check-updates.outputs.upstream_sha }}"
            echo "Build baseline: $BUILD_BASELINE"
            echo "Builder glibc: $BUILDER_GLIBC"
            echo "Minimum GLIBC symbol version required by final AppImage payload: $MAX_GLIBC"
            echo "Compiler CPU flags: ${{ matrix.cflags }}"
            echo
            echo "This file is regenerated on every build; compatibility values are not maintained manually."
          } > "$REPORT"
          cat "$REPORT"

          {
            printf '### AppImage compatibility — %s\n' '${{ matrix.variant }}'
            printf -- '- Build baseline: `%s`\n' "$BUILD_BASELINE"
            printf -- '- Builder glibc: `%s`\n' "$BUILDER_GLIBC"
            printf -- '- Minimum required GLIBC: `%s`\n' "$MAX_GLIBC"
            printf -- '- CPU flags: `%s`\n' '${{ matrix.cflags }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.variant }}
          path: |
            ScummVM-*.AppImage
            ScummVM-*-compat.txt

  # ---------------------------------------------------------------------
  # 3) Pacchetto Arch/CachyOS (.pkg.tar.zst), mirato AVX2
  # ---------------------------------------------------------------------
  build-arch-pkg:
    needs: check-updates
    if: needs.check-updates.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repo (per il PKGBUILD)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Installa dipendenze
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git nasm sudo \
            sdl2 sdl2_net freetype2 libpng libjpeg-turbo giflib \
            libtheora faad2 libmad libvorbis libogg flac libmpeg2 \
            fluidsynth speex speexdsp libvpx curl glew mesa gtk3 \
            zlib bzip2 libutf8proc

      - name: Crea utente non privilegiato per makepkg
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /build
          cp repo/packaging/arch/PKGBUILD /build/
          chown -R builder:builder /build

      - name: Build pacchetto (makepkg)
        run: su builder -c "cd /build && makepkg -s --noconfirm --skippgpcheck"

      - name: Rinomina e prepara artifact
        run: |
          PKG=$(find /build -maxdepth 1 -name "*.pkg.tar.zst" | head -n1)
          cp "$PKG" "$GITHUB_WORKSPACE/scummvm-x86_64.pkg.tar.zst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: scummvm-*.pkg.tar.zst

  # ---------------------------------------------------------------------
  # 4) Pubblica tutto in un'unica release "continuous"
  # ---------------------------------------------------------------------
  publish:
    needs: [check-updates, build-appimage, build-arch-pkg]
    runs-on: ubuntu-latest
    steps:
      - name: Scarica tutti gli artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Genera descrizione release con compatibilità rilevata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          REPORTS=(dist/ScummVM-*-compat.txt)
          if [ ${#REPORTS[@]} -eq 0 ]; then
            echo "::error::Nessun report di compatibilità trovato"
            exit 1
          fi
          {
            echo "Build automatica di ScummVM da upstream master."
            echo "Tutti i motori, release mode, shader OpenGL abilitati."
            echo
            echo "### Compatibilità AppImage rilevata automaticamente"
            echo
            for REPORT in "${REPORTS[@]}"; do
              VARIANT=$(awk -F': ' '$1 == "Variant" {print $2}' "$REPORT")
              BUILD_BASELINE=$(sed -n 's/^Build baseline: //p' "$REPORT")
              MIN_GLIBC=$(sed -n 's/^Minimum GLIBC symbol version required by final AppImage payload: //p' "$REPORT")
              CPU_FLAGS=$(sed -n 's/^Compiler CPU flags: //p' "$REPORT")
              if [ -z "$VARIANT" ] || [ -z "$BUILD_BASELINE" ] || [ -z "$MIN_GLIBC" ] || [ -z "$CPU_FLAGS" ]; then
                echo "::error::Report di compatibilità incompleto: $REPORT"
                exit 1
              fi
              printf -- '- **%s**: GLIBC >= `%s`; builder `%s`; CPU flags `%s`\n' \
                "$VARIANT" "$MIN_GLIBC" "$BUILD_BASELINE" "$CPU_FLAGS"
            done
            echo
            echo "I valori sopra sono rigenerati dal payload finale degli AppImage a ogni build: non sono mantenuti manualmente."
            echo
            echo "Pacchetto Arch/CachyOS: ottimizzato AVX2."
            echo
            echo "Commit sorgente: ${{ needs.check-updates.outputs.upstream_sha }}"
          } > release-body.md
          cat release-body.md
          cat release-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Pubblica/aggiorna release "continuous"
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: "ScummVM (build automatica)"
          bodyFile: release-body.md
          allowUpdates: true
          removeArtifacts: true
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
